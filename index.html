<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>صديقي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
@font-face{font-family:"TradArabic";src:local("Traditional Arabic Bold"),local("TraditionalArabic-Bold"),local("Traditional Arabic");font-weight:100 900;font-display:swap}
/* Layout: one 16:9 picture-book stage at a time, framed like a storybook page, with a toy-like control bar (home · back · next) beneath */
:root{
  --leaf:#2fa84f; --leaf-2:#1c7a37;   /* garden green: primary controls */
  --sky:#6cc8f2;  --sky-2:#2b8fd0;    /* sky */
  --sun:#ffd23f;  --sun-2:#f4a20b;    /* sunshine: highlights */
  --berry:#e8325a;                    /* wrong / attention */
  --grape:#7030a0;                    /* the deck's purple */
  --paper:#fffaf0; --ink:#2a1f3d; --muted:#6b5f80;
  --f-ar:"TradArabic","Traditional Arabic","Amiri","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#bfeaff,#e9f8ff 45%,#dff3d6);background-color:#dff3d6;color:var(--ink);font-family:var(--f-ar);font-weight:700;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{font-synthesis:none}
button{font:inherit;font-weight:700;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:8px}

/* floating backdrop bubbles */
#sky{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}

/* ---------- stage ---------- */
.frame{position:relative;width:var(--sw,960px);height:calc(var(--sw,960px)*9/16);border-radius:clamp(12px,2vw,26px);padding:clamp(4px,.6vw,8px);background:linear-gradient(135deg,#fff,#ffe9a8 40%,#ffd23f);box-shadow:0 20px 50px rgba(42,31,61,.28),inset 0 0 0 2px rgba(255,255,255,.8);perspective:1600px}
.deck{position:relative;width:100%;height:100%;border-radius:clamp(9px,1.6vw,20px);overflow:hidden;background:#fff}
.slide{position:absolute;inset:0;container-type:inline-size;overflow:hidden;background:#fff;direction:ltr}
.slide.in-next{animation:inNext .75s cubic-bezier(.2,.8,.2,1) both}
.slide.out-next{animation:outNext .6s cubic-bezier(.6,0,.4,1) both}
.slide.in-prev{animation:inPrev .75s cubic-bezier(.2,.8,.2,1) both}
.slide.out-prev{animation:outPrev .6s cubic-bezier(.6,0,.4,1) both}
@keyframes inNext{from{transform:translateX(-30%) rotateY(28deg) scale(.85);opacity:0;filter:blur(6px)}}
@keyframes outNext{to{transform:translateX(30%) rotateY(-28deg) scale(.85);opacity:0;filter:blur(6px)}}
@keyframes inPrev{from{transform:translateX(30%) rotateY(-28deg) scale(.85);opacity:0;filter:blur(6px)}}
@keyframes outPrev{to{transform:translateX(-30%) rotateY(28deg) scale(.85);opacity:0;filter:blur(6px)}}
.lay{position:absolute;display:block;max-width:none;pointer-events:none;user-select:none}
.bgl{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.06)}}
.art{position:absolute;inset:0;pointer-events:none;animation:idle 4.5s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-.8%)}}
.art.jump{animation:jump .9s cubic-bezier(.3,1.6,.4,1)}
@keyframes jump{30%{transform:translateY(-6%) scale(1.03)}60%{transform:translateY(0) scale(.98)}}
.slide video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.el{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35;font-family:var(--f-ar);font-weight:700;direction:rtl;border:none;padding:0}
.pop{animation:pop .8s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--dl,0s)}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.drop{animation:dropIn .9s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--dl,0s)}
@keyframes dropIn{from{transform:translateY(-60%);opacity:0}}
.slideR{animation:slideR .9s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--dl,0s)}
@keyframes slideR{from{transform:translateX(60%);opacity:0}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%)}}
.speaking{filter:drop-shadow(0 0 1.2cqw rgba(255,210,63,.95)) brightness(1.06);transform:scale(1.06)!important;transition:transform .3s}

/* speech bubbles */
.bub{background:#fff;color:#c00000;border-radius:50%;font-size:4.4cqw;box-shadow:0 .5cqw 0 rgba(0,0,0,.12);cursor:pointer}
.bub.yellow{background:#ffff00;color:#c00000;border:.3cqw solid #1c3d7a}
.bub.cloud{border-radius:46% 54% 50% 50%/55% 50% 50% 45%}
.bub .tl{position:absolute;width:12%;height:24%;background:inherit;border:inherit}
.bub .dot{position:absolute;border-radius:50%;background:inherit;border:inherit}
.banner{background:linear-gradient(#e41b1b,#b80d0d);color:#fff;border-radius:3cqw 0 0 3cqw;font-size:4.6cqw;box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.3),inset 0 0 0 .4cqw rgba(255,255,255,.5);justify-content:flex-start;padding-right:4cqw!important;cursor:pointer}
.say-hint{position:absolute;width:5.2cqw;height:5.2cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8c8,var(--sun) 60%,var(--sun-2));display:grid;place-items:center;box-shadow:0 .4cqw 0 #c47d05;border:none;cursor:pointer;z-index:5}
.say-hint svg{width:55%;height:55%;color:var(--ink)}
.say-hint.playing{animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 1.2cqw rgba(255,210,63,.45)}}

/* tabs and labels */
.tab{border-radius:999px;font-size:3.6cqw;color:#fff;box-shadow:0 .5cqw 0 rgba(0,0,0,.18)}
.tab.read{background:linear-gradient(#5b8de0,#3a62b8)}
.tab.play{background:linear-gradient(#ff3434,#d40000);border-radius:999px 0 0 999px}
.tab.find{background:linear-gradient(#8e44c4,#6a1fa0);border-radius:3cqw 0 0 3cqw;writing-mode:vertical-rl;font-size:4.4cqw;color:#ffee00}
.tab.sort{background:#ff1a1a;clip-path:polygon(0 0,100% 50%,0 100%);justify-content:flex-start;padding-left:3cqw!important;font-size:3.4cqw}
.tab.join{background:linear-gradient(#5b8de0,#3a62b8);border-radius:0 0 0 3cqw;clip-path:polygon(8% 0,100% 0,100% 100%,0 100%)}
.ml{font-family:"Noto Sans Malayalam","Manjari",system-ui,sans-serif;font-weight:700;font-size:1.7cqw;color:#c00000;background:#fff;border-radius:999px;border:.25cqw solid #c00000;padding:0 1.2cqw!important;direction:ltr;white-space:nowrap}
.ml.yellow{background:#ffff00;color:#1a1a1a;border-color:#c9a300}

/* cards */
.card{background:var(--grape);color:#ffee00;border-radius:4cqw 0 4cqw 0;font-size:6cqw;cursor:pointer;box-shadow:0 1cqw 0 #4a1a70,0 2cqw 3cqw rgba(0,0,0,.25);transition:transform .3s}
.card:hover{transform:translateY(-2%) rotate(-1deg)}
.card .w{display:inline-block;transition:color .2s,transform .2s;margin:0 .6cqw}
.card .w.on{color:#fff;transform:scale(1.15) translateY(-6%);text-shadow:0 0 2cqw #ffee00}
.card.dark{background:linear-gradient(#a10000,#6b0000);border-radius:999px;font-size:4.4cqw;box-shadow:0 .7cqw 0 #3d0000}

/* option buttons */
.opt{border-radius:999px;color:#ffee00;font-size:4.4cqw;cursor:pointer;transition:transform .25s,filter .25s;box-shadow:0 .7cqw 0 rgba(0,0,0,.25)}
.opt:hover{transform:scale(1.05)}
.opt.bad{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-4%)}40%,80%{transform:translateX(4%)}}
.opt.good{filter:brightness(1.15);transform:scale(1.08)}
.opt.dim{filter:grayscale(.7) opacity(.6)}
.mark{position:absolute;pointer-events:none;width:7.4cqw;height:7.4cqw;z-index:6;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.slotbar{white-space:nowrap;border-radius:999px;font-size:5cqw;color:#fff;box-shadow:inset 0 .6cqw 1cqw rgba(0,0,0,.25)}
.slotbar .ans{color:#ffee00;display:inline-block;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.dots{letter-spacing:.2em;opacity:.8}

/* letter circles */
.lt{border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fa6ea,#4472c4 60%,#2f56a3);color:#fff;font-size:6cqw;cursor:pointer;box-shadow:0 .8cqw 0 #22427f,0 1.4cqw 2cqw rgba(0,0,0,.25);transition:transform .2s;padding-bottom:.6cqw!important}
.lt:hover{transform:scale(1.08) rotate(-4deg)}
.lt.used{background:radial-gradient(circle at 35% 30%,#8ee8a0,#2fa84f 60%,#1c7a37);box-shadow:0 .8cqw 0 #135a28;cursor:default}
.lt.bad{animation:shake .5s;background:radial-gradient(circle at 35% 30%,#ff9aa9,#e8325a)}
.wordbox{background:linear-gradient(#d40000,#a30000);border-radius:999px;color:#fff;font-size:7cqw;box-shadow:0 1cqw 0 #6b0000,inset 0 0 0 .4cqw rgba(255,255,255,.25);gap:.2cqw}
.wordbox .ch{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.wlabel{background:radial-gradient(ellipse at 50% 30%,#ffd84d,#f5b800);border-radius:50%;font-size:4.4cqw;color:#2a1f3d;box-shadow:0 .5cqw 0 #c38f00;cursor:pointer}
.fly{position:fixed;z-index:200;pointer-events:none;font-family:var(--f-ar);font-weight:700;color:#fff;transition:transform .7s cubic-bezier(.5,0,.3,1.3),opacity .7s}

/* sort barrels */
.barrel{background:linear-gradient(90deg,#5e2a07,#8a3f0c 30%,#a5531a 50%,#8a3f0c 70%,#5e2a07);border-radius:50%/8%;flex-direction:column;justify-content:flex-start!important;gap:1.2cqw;padding-top:9cqw!important;cursor:pointer;transition:box-shadow .3s}
.barrel::before{content:"";position:absolute;left:0;right:0;top:0;height:16%;border-radius:50%;background:radial-gradient(ellipse,#d9a27a,#b97a50)}
.barrel .lbl{position:absolute;top:1.5%;left:0;right:0;font-size:4.4cqw;color:#2a1f3d;z-index:1}
.barrel.hot{box-shadow:0 0 0 .6cqw var(--sun),0 0 4cqw var(--sun)}
.barrel .in{font-size:3.2cqw;color:#fff;background:var(--leaf);border-radius:999px;padding:0 2cqw;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;position:relative;z-index:1}
.chip{background:linear-gradient(#34c759,#0f9d3a);border-radius:999px;color:#fff;font-size:4.6cqw;cursor:grab;box-shadow:0 .7cqw 0 #0a6a27;transition:transform .2s}
.chip.sel{transform:scale(1.12);box-shadow:0 0 0 .5cqw var(--sun),0 .7cqw 0 #0a6a27}
.chip.gone{opacity:0;pointer-events:none;transform:scale(.3);transition:.4s}

/* game splash */
.big-title{font-size:11cqw;color:#ffd000;-webkit-text-stroke:.35cqw #1c3d7a;paint-order:stroke fill;text-shadow:0 1cqw 0 #1c3d7a}
.pillbtn{border-radius:2cqw;font-size:4.6cqw;color:#fff;background:linear-gradient(#ffc24a,#ff8a00);box-shadow:0 1cqw 0 #c25d00,0 2cqw 3cqw rgba(0,0,0,.2);font-family:"Arial Black",system-ui,sans-serif;letter-spacing:.05em}
.roundbtn{border-radius:50%;color:#fff;font-size:2.6cqw;line-height:1.05;font-family:"Arial Black",system-ui,sans-serif;background:radial-gradient(circle at 35% 30%,#7be0ff,#1d6fd1 65%,#0b3e85);box-shadow:0 0 0 .6cqw #fff,0 0 0 1.1cqw #1d6fd1,0 1.2cqw 2cqw rgba(0,0,0,.25)}
.gameover{font-family:"Arial Black",system-ui,sans-serif;font-size:9cqw;line-height:.95;color:#ff3b6b;-webkit-text-stroke:.3cqw #fff;text-shadow:0 .6cqw 0 #b0003a,0 1.2cqw 2cqw rgba(0,0,0,.25);flex-direction:column}
.cursor{position:absolute;width:4cqw;height:4cqw;pointer-events:none;animation:tap 1.2s ease-in-out infinite}
@keyframes tap{50%{transform:translate(-20%,-20%) scale(.9)}}

/* score stars on game slides */
.stars{position:absolute;left:1.5%;bottom:2%;display:flex;gap:.6cqw;font-size:3cqw;z-index:7;direction:ltr}
.stars i{font-style:normal;filter:grayscale(1) opacity(.4);transition:.4s}
.stars i.on{filter:none;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}

/* splash on page 1 */
.splash{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,255,255,.15),rgba(28,61,122,.45));backdrop-filter:blur(2px)}
.splash button{font-size:5cqw;padding:1.2cqw 5cqw;border-radius:999px;border:none;background:linear-gradient(#5be37f,#1fa34a);color:#fff;box-shadow:0 1cqw 0 #137034,0 0 0 1cqw rgba(255,255,255,.6);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}

/* ---------- control bar ---------- */
.bar{width:var(--sw,960px);display:flex;align-items:center;gap:10px;direction:rtl}
.nb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;min-width:48px;padding:0 18px;border:none;border-radius:999px;font-size:18px;color:#fff;background:linear-gradient(#3ccf68,var(--leaf));box-shadow:0 5px 0 var(--leaf-2),0 10px 18px rgba(28,122,55,.25);transition:transform .15s}
.nb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-2)}
.nb.home{background:linear-gradient(#5aa9ff,var(--sky-2));box-shadow:0 5px 0 #1d5f96,0 10px 18px rgba(29,95,150,.25)}
.nb.next{background:linear-gradient(#ffd24d,var(--sun-2));color:var(--ink);box-shadow:0 5px 0 #b87400,0 10px 18px rgba(184,116,0,.25)}
.nb[disabled]{filter:grayscale(1) opacity(.45);cursor:default}
.nb svg{width:22px;height:22px}
.prog{flex:1;min-width:60px;height:14px;border-radius:99px;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,var(--sun),var(--leaf));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.count{font-size:18px;color:var(--muted);min-width:4.5em;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 0 #d6cfe3;font-size:18px}
.iconbtn.on{background:var(--sun)}
.lbl-s{display:inline;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:700;letter-spacing:.02em}
@media (max-width:600px){.lbl-s{font-size:15px}.nb{padding:0 12px;height:42px}.count{font-size:15px;min-width:3.5em}}

.rot{display:none;margin:0;text-align:center;font-family:"Noto Sans Malayalam",system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--muted)}
@media (orientation:portrait) and (max-width:700px){.rot{display:block;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300;width:100%;height:100%}
#toast{position:fixed;z-index:310;left:50%;top:14px;transform:translate(-50%,-30px);opacity:0;pointer-events:none;width:min(520px,calc(100vw - 32px));direction:rtl;text-align:center;background:#fff;border:3px solid var(--sun);border-radius:16px;padding:10px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25);transition:.4s;font-size:16px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{font-family:system-ui,sans-serif;font-weight:400;color:var(--muted);display:block;line-height:1.5}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <div class="frame" id="frame"><div class="deck" id="deck"></div></div>
  <nav class="bar" aria-label="التنقل">
    <button class="nb home" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg><span class="lbl-s">Home</span></button>
    <button class="nb" id="prevBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7z"/></svg><span class="lbl-s">Back</span></button>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
    <span class="count" id="count">١ / ٣٤</span>
    <button class="iconbtn" id="replayBtn" aria-label="أعد الصوت">🔁</button>
    <button class="nb next" id="nextBtn" aria-label="Next"><span class="lbl-s">Next</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5 8 12l8 7z"/></svg></button>
  </nav>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<p class="rot" aria-hidden="true">📱↻ ഫോൺ ചെരിച്ചു പിടിച്ചാൽ വലുതായി കാണാം</p>

  music(p.music||null);
  setTimeout(()=>{if(curSlide===s&&(unlocked||i>0))p.enter&&p.enter(s)},first?0:420);if(first&&p.n===1)p.enter(s);
  $('#prevBtn').disabled=i===0;$('#nextBtn').disabled=i===PAGES.length-1;$('#count').textContent=ar(i+1)+' / '+ar(PAGES.length);$('#progBar').style.width=((i)/(PAGES.length-1)*100)+'%';
  try{history.replaceState(null,'','#p'+(i+1))}catch(e){}
}
$('#nextBtn').onclick=()=>{unlocked=true;go(idx+1)};$('#prevBtn').onclick=()=>{unlocked=true;go(idx-1)};$('#homeBtn').onclick=()=>{unlocked=true;go(0)};
$('#replayBtn').onclick=()=>{const p=PAGES[idx];unlocked=true;if(p.replay)p.replay(curSlide);else if(p.enter&&!p.game)p.enter(curSlide)};
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowLeft'){unlocked=true;go(idx+1)}else if(e.key==='ArrowRight'){unlocked=true;go(idx-1)}else if(e.key==='Home'){go(0)}});
/* swipe */
let sx=null;deck.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});deck.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){unlocked=true;go(idx+(dx>0?1:-1))}sx=null},{passive:true});

/* fit 16:9 into the window */
function fit(){const barH=62;const w=Math.min(innerWidth-Math.max(32,0),(innerHeight-barH-30)*16/9);document.documentElement.style.setProperty('--sw',Math.max(280,Math.floor(w))+'px')}
fit();addEventListener('resize',fit);

/* letter flying to target */
function flyTo(from,to,cb){if(reduce){cb&&cb();return}const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();const f=document.createElement('div');f.className='fly';f.textContent=from.textContent;f.style.cssText+=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;display:grid;place-items:center;font-size:${a.height*.55}px;background:#ffd23f;color:#2a1f3d;border-radius:${a.height/2}px;box-shadow:0 10px 20px rgba(0,0,0,.25)`;
  document.body.appendChild(f);requestAnimationFrame(()=>{f.style.transform=`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(.6) rotate(360deg)`;f.style.opacity='.2'});setTimeout(()=>{f.remove();cb&&cb()},700)}

/* sparkles inside each page */
function sparkles(cv){if(!cv||reduce)return;const cx=cv.getContext('2d');const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;const ps=[];for(let i=0;i<16;i++)ps.push({x:Math.random(),y:Math.random(),s:.0008+Math.random()*.0016,p:Math.random()*6.3,r:1+Math.random()*2.4});
  (function loop(){if(!cv.isConnected)return;cx.clearRect(0,0,cv.width,cv.height);ps.forEach(q=>{q.y-=q.s;q.p+=.05;if(q.y<-.05){q.y=1.05;q.x=Math.random()}const a=.3+.5*Math.abs(Math.sin(q.p));cx.globalAlpha=a;cx.fillStyle='#fffbd0';cx.beginPath();const X=q.x*cv.width,Y=q.y*cv.height,R=q.r*(cv.width/600);
    cx.moveTo(X,Y-R*2);cx.lineTo(X+R*.6,Y-R*.6);cx.lineTo(X+R*2,Y);cx.lineTo(X+R*.6,Y+R*.6);cx.lineTo(X,Y+R*2);cx.lineTo(X-R*.6,Y+R*.6);cx.lineTo(X-R*2,Y);cx.lineTo(X-R*.6,Y-R*.6);cx.fill()});requestAnimationFrame(loop)})()}

/* backdrop: drifting bubbles and butterflies */
(function(){const cv=$('#sky'),cx=cv.getContext('2d');let W,H;const ps=[];const size=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};size();addEventListener('resize',size);
  for(let i=0;i<22;i++)ps.push({x:Math.random(),y:Math.random(),r:6+Math.random()*26,s:.0003+Math.random()*.0007,p:Math.random()*6.3,b:Math.random()<.25});
  (function loop(){cx.clearRect(0,0,W,H);ps.forEach(q=>{q.y-=q.s;q.p+=.01;if(q.y<-.1){q.y=1.1;q.x=Math.random()}const X=q.x*W+Math.sin(q.p)*30,Y=q.y*H;
    if(q.b){cx.font=`${q.r}px serif`;cx.globalAlpha=.55;cx.fillText('🦋',X,Y)}else{cx.globalAlpha=.35;cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.arc(X,Y,q.r,0,7);cx.stroke();cx.globalAlpha=.12;cx.fillStyle='#fff';cx.fill()}});if(!reduce)requestAnimationFrame(loop)})()})();

/* confetti */
const cf=$('#confetti'),cfx=cf.getContext('2d');let parts=[],run=false;const cfs=()=>{cf.width=innerWidth*devicePixelRatio;cf.height=innerHeight*devicePixelRatio};cfs();addEventListener('resize',cfs);
const COLS=['#ffd23f','#e8325a','#2fa84f','#2b8fd0','#7030a0','#ff8fb1'];
function burst(x,y,n){if(reduce)return;for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=3+Math.random()*(n>80?12:7);parts.push({x:x*devicePixelRatio,y:y*devicePixelRatio,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,r:4+Math.random()*5,c:COLS[i%6],l:70+Math.random()*50,rot:Math.random()*6,e:Math.random()<.18})}if(!run){run=true;requestAnimationFrame(cfl)}}
function burstAt(el,n){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n)}
function cfl(){cfx.clearRect(0,0,cf.width,cf.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.vy+=.25;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.rot+=.15;cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.rot);cfx.globalAlpha=Math.min(1,p.l/30);
  if(p.e){cfx.font=`${p.r*5*devicePixelRatio}px serif`;cfx.fillText(Math.random()<.5?'⭐':'🦋',0,0)}else{cfx.fillStyle=p.c;cfx.fillRect(-p.r,-p.r/2,p.r*2*devicePixelRatio,p.r*devicePixelRatio)}cfx.restore()});if(parts.length)requestAnimationFrame(cfl);else{run=false;cfx.clearRect(0,0,cf.width,cf.height)}}

/* start */
let start=0;try{const m=/^#p(\d+)$/.exec(location.hash);if(m)start=Math.min(PAGES.length-1,Math.max(0,+m[1]-1))}catch(e){}
if(start>0)unlocked=false;
go(start,true);
})();
</script>

</html>
